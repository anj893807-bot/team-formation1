# Supabase 무료 프로젝트가 1주일 동안 요청이 적어 일시정지되지 않도록 매일 DB에 질의를 보낸다.
# 필요한 설정: 깃허브 저장소 Settings > Secrets and variables > Actions 에 DATABASE_URL 추가
name: DB keepalive

on:
  schedule:
    - cron: "17 0 * * *"   # 매일 00:17 UTC (한국 시각 09:17)
  workflow_dispatch: {}     # Actions 탭에서 직접 실행해 볼 수 있음

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]>=3.2" "psycopg-pool>=3.2" bcrypt
      - run: python scripts/keepalive.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
